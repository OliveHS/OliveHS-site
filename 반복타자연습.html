<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>타닥타닥 — 한글 타자연습</title>
  <style>
    :root { --ink:#35305a; --muted:#847f9e; --paper:#f3efff; --surface:#fff; --line:#ded7f4; --purple:#7763cf; --purple-soft:#e6ddff; --green:#5bae92; --orange:#dfa76d; --red:#d97882; --peach:#ffe5ca; }
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,var(--paper) 0%,var(--paper) 62%,var(--peach) 62%,var(--peach) 100%);color:var(--ink);font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;min-width:320px}
    .app{max-width:1040px;margin:auto;padding:36px 24px 48px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:42px}.brand{font-size:23px;font-weight:800;letter-spacing:-1.5px}.brand i{font-style:normal;color:var(--purple)}button{font:inherit;cursor:pointer;border:0}.settings-btn{padding:10px 15px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:var(--ink);font-weight:700;box-shadow:0 3px 0 #d9d2ed}.settings-btn:hover{border-color:var(--purple);color:var(--purple)}
    .practice{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:32px;box-shadow:0 12px 0 #ded7f470}.mascot{position:absolute;right:28px;top:-25px;width:72px;height:66px;background:var(--peach);border:2px solid var(--ink);border-radius:46% 46% 42% 42%;z-index:1}.mascot:before,.mascot:after{content:"";position:absolute;top:-25px;width:21px;height:37px;background:var(--peach);border:2px solid var(--ink);border-bottom:0;border-radius:18px 18px 4px 4px}.mascot:before{left:9px;transform:rotate(-10deg)}.mascot:after{right:9px;transform:rotate(10deg)}.mascot .face{position:absolute;inset:0;z-index:2}.mascot .face:before{content:"•  •";position:absolute;left:19px;top:22px;letter-spacing:10px;font-size:14px;font-weight:900}.mascot .face:after{content:"⌣";position:absolute;left:30px;top:33px;font-size:21px;font-weight:800}.mascot-label{position:absolute;right:104px;top:15px;padding:7px 10px;background:var(--peach);border-radius:12px 12px 2px 12px;font-size:12px;font-weight:700;color:var(--ink)}.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px}.level{color:var(--purple);font-weight:700;background:var(--purple-soft);padding:6px 10px;border-radius:10px}.prompt{font-size:clamp(27px,5vw,45px);letter-spacing:-2px;font-weight:760;line-height:1.45;text-align:center;padding:51px 10px 34px;word-break:keep-all}.prompt .done{color:#b8beca}.prompt .now{color:var(--purple);text-decoration:underline;text-decoration-color:#c5c0ff;text-underline-offset:9px}.typing{display:block;width:100%;resize:none;height:70px;padding:18px 20px;border:2px solid var(--line);border-radius:16px;font-size:20px;outline:0;letter-spacing:-.5px;color:var(--ink)}.typing:focus{border-color:var(--purple);box-shadow:0 0 0 4px #7763cf18}.typing.error{border-color:var(--red);box-shadow:0 0 0 4px #d9788214}.status{height:25px;margin:10px 2px 0;font-size:14px;color:var(--muted)}.status.good{color:var(--green);font-weight:650}.progress-wrap{height:8px;background:#eeeaf8;border-radius:99px;margin-top:19px;overflow:hidden}.progress{height:100%;background:var(--purple);width:0;transition:width .15s}.stats{display:flex;justify-content:center;gap:34px;margin-top:27px;color:var(--muted);font-size:13px}.stats strong{display:block;color:var(--ink);font-size:20px;text-align:center;margin-bottom:2px}
    .history{margin-top:36px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 28px}.history-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px}.history h2{margin:0;font-size:18px;letter-spacing:-.8px}.history-head span{font-size:13px;color:var(--muted)}.chart-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.chart-card{min-width:0;background:#fafbfe;border-radius:12px;padding:15px}.chart-card h3{margin:0 0 2px;font-size:14px}.chart-card p{margin:0;color:var(--muted);font-size:12px}.chart-value{font-size:23px;font-weight:750;letter-spacing:-1px;margin:5px 0 7px}.chart{display:block;width:100%;height:auto}.chart text{font-size:10px;fill:var(--muted)}.chart .grid{stroke:#e6eaf2;stroke-width:1}.chart .area{opacity:.15}.chart .line{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.chart .point{stroke:#fff;stroke-width:2}.empty-chart{height:112px;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center}
    .keyboard-area{margin-top:38px}.keyboard-title{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin:0 4px 15px}.keyboard-title b{color:var(--ink)}.keyboard{background:#e9edf5;border-radius:16px;padding:14px;display:grid;gap:7px}.row{display:flex;gap:7px;justify-content:center}.key{height:43px;min-width:43px;padding:3px 5px;background:var(--surface);border:1px solid #dce1ea;border-radius:8px;box-shadow:0 2px 0 #d8dde6;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#8d95a5;transition:.12s}.key span{font-size:15px;color:var(--ink);font-weight:650}.key.wide{min-width:69px}.key.space{width:300px}.key.next{background:var(--purple);border-color:var(--purple);box-shadow:0 2px 0 #5245d5;color:#e9e7ff;transform:translateY(-1px)}.key.next span{color:#fff}.key.pressed{background:#b8f2db;border-color:#55cc9a;box-shadow:0 2px 0 #55cc9a}.legend{display:flex;justify-content:center;gap:16px;margin-top:13px;font-size:12px;color:var(--muted)}.dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;background:var(--purple)}.dot.p{background:#b8f2db}
    .modal{display:none;position:fixed;inset:0;background:#1c233366;z-index:2;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.dialog{width:min(570px,100%);background:var(--surface);padding:27px;border-radius:18px;box-shadow:0 25px 70px #121b3388}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog h2{margin:0;font-size:22px;letter-spacing:-1px}.close{font-size:24px;background:transparent;color:var(--muted)}.dialog p{color:var(--muted);font-size:14px;line-height:1.6;margin:10px 0 23px}.label{font-size:14px;font-weight:700;display:flex;justify-content:space-between;margin-bottom:10px}.label em{font-style:normal;color:var(--purple)}input[type=range]{width:100%;accent-color:var(--purple)}.samples{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 22px}.sample{padding:8px 11px;border-radius:8px;background:#f2f4f8;color:#4b5567;font-size:13px}.sample:hover{background:var(--purple-soft);color:var(--purple)}.sentence{width:100%;min-height:90px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;outline:0;line-height:1.55}.sentence:focus{border-color:var(--purple)}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.cancel,.apply{padding:11px 15px;border-radius:9px;font-weight:700}.cancel{background:#f0f2f6;color:#657084}.apply{background:var(--purple);color:#fff}
    @media(max-width:600px){.app{padding:20px 14px}.top{margin-bottom:25px}.practice,.history{padding:21px 16px}.mascot{right:15px;transform:scale(.78);transform-origin:top right}.mascot-label{display:none}.prompt{padding:37px 0 24px}.chart-grid{grid-template-columns:1fr}.keyboard{padding:8px;gap:4px}.row{gap:4px}.key{height:36px;min-width:28px;font-size:8px;border-radius:6px}.key span{font-size:11px}.key.wide{min-width:43px}.key.space{width:150px}.stats{gap:19px}.dialog{padding:22px}.meta{font-size:12px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><div class="brand">타닥<i>타닥</i></div><button class="settings-btn" id="openSettings">문장 설정 ⚙</button></header>
    <section class="practice" aria-label="타자 연습"><div class="mascot-label">천천히, 또박또박!</div><div class="mascot" role="img" aria-label="웃고 있는 토끼 캐릭터"><div class="face"></div></div>
      <div class="meta"><span class="level">반복 연습</span><span id="charCount">0 / 0자</span></div>
      <div class="prompt" id="prompt" aria-live="polite"></div>
      <textarea class="typing" id="typing" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="여기에 문장을 입력하세요" aria-label="연습 문장 입력"></textarea>
      <div class="status" id="status" aria-live="polite">문장을 보고 천천히 시작해 보세요.</div>
      <div class="progress-wrap"><div class="progress" id="progress"></div></div>
      <div class="stats"><div><strong id="rounds">0</strong>완료 횟수</div><div><strong id="speed">—</strong>타수 / 분</div><div><strong id="accuracy">100%</strong>정확도</div></div>
    </section>
    <section class="history" aria-label="연습 기록 변화"><div class="history-head"><h2>연습 변화</h2><span>완료할 때마다 기록됩니다</span></div><div class="chart-grid" id="chartGrid"></div></section>
    <section class="keyboard-area" aria-label="두벌식 키보드 안내"><div class="keyboard-title"><span>다음 키: <b id="nextKey">—</b></span><span>두벌식 자판</span></div><div class="keyboard" id="keyboard"></div><div class="legend"><span><i class="dot"></i>다음에 누를 키</span><span><i class="dot p"></i>방금 누른 키</span></div></section>
  </main>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="settingTitle"><div class="dialog"><div class="dialog-head"><h2 id="settingTitle">연습 문장 설정</h2><button class="close" id="closeSettings" aria-label="닫기">×</button></div><p>글자 수를 고르면 예시 문장을 불러옵니다. 원하는 단어나 문장은 직접 고쳐서 쓸 수 있어요.</p><label class="label" for="length"><span>문장 길이</span><em id="lengthValue">12자</em></label><input type="range" id="length" min="4" max="40" value="12"><div class="samples" id="samples"></div><label class="label" for="sentence"><span>연습할 문장</span><em id="editCount">0자</em></label><textarea class="sentence" id="sentence"></textarea><div class="actions"><button class="cancel" id="cancel">취소</button><button class="apply" id="apply">이 문장으로 연습하기</button></div></div></div>
  <script>
    const samples=['가는 말이 고와야 오는 말이 곱다.','고생 끝에 낙이 온다.','천 리 길도 한 걸음부터.','백지장도 맞들면 낫다.','등잔 밑이 어둡다.','아는 길도 물어 가라.','호랑이도 제 말 하면 온다.','열 번 찍어 안 넘어가는 나무 없다.'];
    let target=samples[0], startedAt=0, rounds=0, lastCode='', roundErrors=0, wasWrong=false, history=[];
    const $=s=>document.querySelector(s); const input=$('#typing'), prompt=$('#prompt');
    const keyRows=[['ㅂ','ㅈ','ㄷ','ㄱ','ㅅ','ㅛ','ㅕ','ㅑ','ㅐ','ㅔ'],['ㅁ','ㄴ','ㅇ','ㄹ','ㅎ','ㅗ','ㅓ','ㅏ','ㅣ'],['ㅋ','ㅌ','ㅊ','ㅍ','ㅠ','ㅜ','ㅡ']];
    const codes=[['KeyQ','KeyW','KeyE','KeyR','KeyT','KeyY','KeyU','KeyI','KeyO','KeyP'],['KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK','KeyL'],['KeyZ','KeyX','KeyC','KeyV','KeyB','KeyN','KeyM']];
    const keyboard=$('#keyboard');
    keyRows.forEach((row,i)=>{const div=document.createElement('div');div.className='row';row.forEach((key,j)=>{const el=document.createElement('div');el.className='key';el.dataset.code=codes[i][j];el.innerHTML='<span>'+key+'</span><small>'+codes[i][j].slice(-1)+'</small>';div.append(el)});keyboard.append(div)});
    const bottom=document.createElement('div');bottom.className='row';bottom.innerHTML='<div class="key wide" data-code="ShiftLeft"><span>⇧</span></div><div class="key space" data-code="Space"><span>공백</span></div><div class="key wide" data-code="Backspace"><span>⌫</span></div>';keyboard.append(bottom);
    const choseong='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ', jung='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ', jong=' ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ';
    const keyMap={ㄱ:'KeyR',ㄲ:'KeyR',ㄴ:'KeyS',ㄷ:'KeyE',ㄸ:'KeyE',ㄹ:'KeyF',ㅁ:'KeyA',ㅂ:'KeyQ',ㅃ:'KeyQ',ㅅ:'KeyT',ㅆ:'KeyT',ㅇ:'KeyD',ㅈ:'KeyW',ㅉ:'KeyW',ㅊ:'KeyC',ㅋ:'KeyZ',ㅌ:'KeyX',ㅍ:'KeyV',ㅎ:'KeyG',ㅏ:'KeyK',ㅐ:'KeyO',ㅑ:'KeyI',ㅒ:'KeyO',ㅓ:'KeyJ',ㅔ:'KeyP',ㅕ:'KeyU',ㅖ:'KeyP',ㅗ:'KeyH',ㅛ:'KeyY',ㅜ:'KeyN',ㅠ:'KeyB',ㅡ:'KeyM',ㅣ:'KeyL',' ':'Space'};
    function firstKey(ch){if(!ch)return null;if(ch===' ')return 'Space';const n=ch.charCodeAt(0)-44032;if(n<0||n>11171)return null;return keyMap[choseong[Math.floor(n/588)]]}
    function render(){const typed=input.value, ok=target.startsWith(typed), at=Math.min(typed.length,target.length); prompt.innerHTML=[...target].map((c,i)=>'<span class="'+(i<at?'done':i===at?'now':'')+'">'+(c===' '?'&nbsp;':c)+'</span>').join(''); $('#charCount').textContent=at+' / '+target.length+'자'; $('#progress').style.width=(at/target.length*100)+'%'; $('#accuracy').textContent=ok?'100%':'수정 필요'; input.classList.toggle('error',!ok); const code=firstKey(target[at]); document.querySelectorAll('.key').forEach(x=>x.classList.toggle('next',x.dataset.code===code)); $('#nextKey').textContent=code?document.querySelector('[data-code="'+code+'"]').querySelector('span').textContent:'완료'; if(!ok){$('#status').textContent='다른 글자가 입력됐어요. 마지막 글자를 지우고 이어가세요.';$('#status').className='status'} else if(at===target.length){finish()} else {$('#status').textContent='문장을 보고 천천히 시작해 보세요.';$('#status').className='status'}}
    function drawChart(title, unit, values, color, fixedMax){const latest=values.at(-1), max=fixedMax||Math.max(...values,1), min=fixedMax?0:Math.min(0,...values), range=Math.max(max-min,1), w=220,h=115,l=25,r=7,t=10,b=20;const x=i=>values.length===1?(l+w-r)/2:l+i*(w-l-r)/(values.length-1), y=v=>t+(h-t-b)*(1-(v-min)/range);const pts=values.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');const area='M '+x(0)+' '+(h-b)+' L '+values.map((v,i)=>x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' L ')+' L '+x(values.length-1)+' '+(h-b)+' Z';const ticks=[0,.5,1].map(p=>{const yy=t+p*(h-t-b), val=Math.round(max-p*(max-min));return '<line class="grid" x1="'+l+'" x2="'+(w-r)+'" y1="'+yy+'" y2="'+yy+'"/><text x="0" y="'+(yy+3)+'">'+val+'</text>'}).join('');const labels=values.length>1?'<text x="'+l+'" y="'+(h-4)+'">1회</text><text text-anchor="end" x="'+(w-r)+'" y="'+(h-4)+'">'+values.length+'회</text>':'';return '<article class="chart-card"><h3>'+title+'</h3><p>회차별 변화</p><div class="chart-value">'+latest+unit+'</div><svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+title+' 변화 차트">'+ticks+'<path class="area" fill="'+color+'" d="'+area+'"/><polyline class="line" stroke="'+color+'" points="'+pts+'"/>'+values.map((v,i)=>'<circle class="point" fill="'+color+'" cx="'+x(i)+'" cy="'+y(v)+'" r="3.5"/>').join('')+labels+'</svg></article>'}
    function renderCharts(){const grid=$('#chartGrid');if(!history.length){grid.innerHTML='<div class="empty-chart">첫 문장을 완료하면<br>변화 추이가 나타납니다.</div>';return}grid.innerHTML=drawChart('타수','타/분',history.map(x=>x.speed),'#19aa73')+drawChart('정확도','%',history.map(x=>x.accuracy),'#ff9f1c',100)}
    function finish(){const mins=Math.max((Date.now()-startedAt)/60000,.01), speed=Math.round(target.length/mins), accuracy=Math.max(0,Math.round(target.length/(target.length+roundErrors)*100));$('#speed').textContent=speed;rounds++;$('#rounds').textContent=rounds;$('#accuracy').textContent=accuracy+'%';history.push({round:rounds,speed,accuracy});renderCharts();$('#status').textContent='좋아요! 같은 문장을 다시 입력해 보세요.';$('#status').className='status good';setTimeout(()=>{input.value='';roundErrors=0;startedAt=Date.now();render();input.focus()},700)}
    input.addEventListener('focus',()=>{if(!startedAt)startedAt=Date.now()});input.addEventListener('input',e=>{const wrong=input.value&&!target.startsWith(input.value);if(wrong&&!wasWrong&&!e.isComposing)roundErrors++;wasWrong=wrong;render()});window.addEventListener('keydown',e=>{if(document.activeElement===input){document.querySelectorAll('.key').forEach(x=>x.classList.toggle('pressed',x.dataset.code===e.code));lastCode=e.code}});window.addEventListener('keyup',()=>document.querySelectorAll('.key').forEach(x=>x.classList.remove('pressed')));
    const modal=$('#modal'), sentence=$('#sentence'), length=$('#length'); function show(){sentence.value=target;$('#editCount').textContent=target.length+'자';modal.classList.add('open');sentence.focus()}function close(){modal.classList.remove('open')} $('#openSettings').onclick=show;$('#closeSettings').onclick=close;$('#cancel').onclick=close;modal.onclick=e=>{if(e.target===modal)close()};
    function showSamples(){const n=+length.value;$('#lengthValue').textContent=n+'자';const choices=samples.map(s=>s.length>n?s.slice(0,n):s).filter(s=>s.length>=Math.min(4,n));$('#samples').innerHTML=choices.map(s=>'<button class="sample">'+s+'</button>').join('');document.querySelectorAll('.sample').forEach((b,i)=>b.onclick=()=>{sentence.value=choices[i];$('#editCount').textContent=sentence.value.length+'자'})}length.oninput=showSamples;sentence.oninput=()=>$('#editCount').textContent=sentence.value.length+'자'; $('#apply').onclick=()=>{const next=sentence.value.trim();if(next){target=next;input.value='';startedAt=0;roundErrors=0;wasWrong=false;history=[];rounds=0;$('#rounds').textContent=0;$('#speed').textContent='—';$('#accuracy').textContent='100%';renderCharts();render();close();input.focus()}};showSamples();renderCharts();render();
  </script>
</body>
</html>
